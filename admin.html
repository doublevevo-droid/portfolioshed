<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Управление проектами</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Admin specific styles ── */
    .admin-container {
      min-height: 100vh;
      padding: 80px 32px 40px;
      background: var(--bg);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      gap: 20px;
    }

    .admin-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .admin-logout {
      padding: 10px 20px;
      background: #ff3b30;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s var(--t);
    }

    .admin-logout:hover {
      background: #ff453a;
      transform: translateY(-2px);
    }

    .admin-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Form Section ── */
    .form-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 40px;
      box-shadow: var(--shadow-sm);
    }

    .form-section h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text-primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      transition: all 0.2s var(--t);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg-secondary);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-start;
    }

    .btn-submit,
    .btn-reset {
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--t);
      font-size: 14px;
    }

    .btn-submit {
      background: var(--accent);
      color: white;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-reset {
      background: var(--border);
      color: var(--text-primary);
    }

    .btn-reset:hover {
      background: var(--border-strong);
    }

    /* ── Projects List ── */
    .projects-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow-sm);
    }

    .projects-section h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--text-primary);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 20px;
      transition: all 0.2s var(--t);
    }

    .project-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }

    .project-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .project-card h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      word-break: break-word;
    }

    .project-card-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .project-badge {
      font-size: 12px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 100px;
      font-weight: 600;
    }

    .project-card-meta {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
    }

    .project-card-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .project-card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-edit,
    .btn-delete {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--t);
    }

    .btn-edit {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn-edit:hover {
      background: var(--accent);
      color: white;
    }

    .btn-delete {
      background: rgba(255, 59, 48, 0.1);
      color: #ff3b30;
    }

    .btn-delete:hover {
      background: #ff3b30;
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state-text {
      font-size: 16px;
      margin-bottom: 24px;
    }

    /* ── Modal ── */
    .admin-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .admin-modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .admin-modal-content {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 32px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }

    .admin-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .admin-modal-header h3 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .admin-modal-close {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--border);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      font-size: 20px;
      transition: all 0.2s var(--t);
    }

    .admin-modal-close:hover {
      background: var(--border-strong);
    }

    /* ── Auth Modal ── */
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      padding: 20px;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow-md);
    }

    .auth-card h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .auth-card-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .auth-form-group {
      margin-bottom: 16px;
    }

    .auth-form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .auth-form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      transition: all 0.2s var(--t);
    }

    .auth-form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg-secondary);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .auth-form-group button {
      width: 100%;
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s var(--t);
      margin-top: 8px;
    }

    .auth-form-group button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .auth-error {
      padding: 12px;
      background: rgba(255, 59, 48, 0.1);
      color: #ff3b30;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .auth-error.active {
      display: block;
    }

    .status-message {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 500;
    }

    .status-success {
      background: rgba(52, 211, 153, 0.15);
      color: #10b981;
    }

    .status-error {
      background: rgba(255, 59, 48, 0.1);
      color: #ff3b30;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .admin-container {
        padding: 80px 16px 40px;
      }

      .form-section,
      .projects-section {
        padding: 20px;
      }

      .admin-header {
        flex-direction: column;
        align-items: stretch;
      }

      .admin-header h1 {
        font-size: 24px;
      }

      .admin-logout {
        width: 100%;
        text-align: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .auth-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

<!-- ── Auth Section ── -->
<div id="authSection" class="auth-container" style="display: flex;">
  <div class="auth-card">
    <h1>🔐 Админ-панель</h1>
    <p class="auth-card-subtitle">Введите пароль для доступа к управлению проектами</p>
    <div class="auth-error" id="authError"></div>
    <form id="authForm" onsubmit="handleLogin(event)">
      <div class="auth-form-group">
        <label for="adminPassword">Пароль:</label>
        <input type="password" id="adminPassword" required>
      </div>
      <div class="auth-form-group">
        <button type="submit">Войти</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Admin Section ── -->
<div id="adminSection" style="display: none;">
  <div class="admin-container">
    <div class="admin-header">
      <h1>📊 Управление проектами</h1>
      <button class="admin-logout" onclick="handleLogout()">Выход</button>
    </div>

    <div class="admin-content">
      <!-- Form Section -->
      <div class="form-section">
        <h2 id="formTitle">➕ Добавить новый проект</h2>
        <div id="statusMessage"></div>
        <form id="projectForm" onsubmit="handleFormSubmit(event)">
          <div class="form-grid">
            <div class="form-group">
              <label for="projectName">Название проекта *</label>
              <input type="text" id="projectName" required>
            </div>

            <div class="form-group">
              <label for="projectPrice">Цена/бюджет</label>
              <input type="text" id="projectPrice" placeholder="$5000, 50000₽, По запросу">
            </div>

            <div class="form-group">
              <label for="projectTime">Время разработки</label>
              <input type="text" id="projectTime" placeholder="2 недели, 1 месяц">
            </div>

            <div class="form-group">
              <label for="projectStatus">Статус</label>
              <select id="projectStatus">
                <option value="Завершён">✓ Завершён</option>
                <option value="В разработке">⧗ В разработке</option>
                <option value="На паузе">⏸ На паузе</option>
              </select>
            </div>

            <div class="form-group form-full">
              <label for="projectDesc">Короткое описание (видно в каталоге) *</label>
              <textarea id="projectDesc" required></textarea>
            </div>

            <div class="form-group form-full">
              <label for="projectFullDesc">Полное описание (видно при клике)</label>
              <textarea id="projectFullDesc"></textarea>
            </div>

            <div class="form-group form-full">
              <label for="projectImage">URL изображения проекта</label>
              <input type="url" id="projectImage" placeholder="https://example.com/image.jpg">
            </div>

            <div class="form-group form-full">
              <label for="projectUrl">URL проекта (ссылка на кнопку)</label>
              <input type="url" id="projectUrl" placeholder="https://example.com">
            </div>

            <div class="form-group form-full">
              <label for="projectTags">Теги (через запятую)</label>
              <input type="text" id="projectTags" placeholder="React, Node.js, PostgreSQL">
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-submit" id="submitBtn">Добавить проект</button>
            <button type="reset" class="btn-reset" onclick="resetForm()">Очистить</button>
          </div>
        </form>
      </div>

      <!-- Projects List -->
      <div class="projects-section">
        <h2>📁 Все проекты (<span id="projectCount">0</span>)</h2>
        <div id="projectsList" class="projects-grid">
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <div class="empty-state-text">Проектов пока нет. Добавьте первый проект!</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Delete Confirmation Modal ── -->
<div id="deleteModal" class="admin-modal">
  <div class="admin-modal-content">
    <div class="admin-modal-header">
      <h3>Удалить проект?</h3>
      <button class="admin-modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <p id="deleteConfirmText" style="color: var(--text-secondary); margin-bottom: 24px; font-size: 14px;"></p>
    <div style="display: flex; gap: 12px;">
      <button class="btn-reset" style="flex: 1;" onclick="closeDeleteModal()">Отмена</button>
      <button class="btn-delete" style="flex: 1; border: none;" onclick="confirmDelete()">Удалить</button>
    </div>
  </div>
</div>

<script>
  // ── Constants ──
  const STORAGE_KEY = 'shed_projects';
  const AUTH_KEY = 'admin_auth';
  const ADMIN_PASSWORD = '1234'; // Change this to your secure password
  let projects = [];
  let currentEditId = null;
  let deleteTargetId = null;

  // ── Init ──
  window.addEventListener('load', () => {
    projects = getProjects();
    checkAuth();
  });

  // ── Auth Functions ──
  function checkAuth() {
    const isAuthed = localStorage.getItem(AUTH_KEY) === 'true';
    const authSection = document.getElementById('authSection');
    const adminSection = document.getElementById('adminSection');

    if (isAuthed) {
      authSection.style.display = 'none';
      adminSection.style.display = 'block';
      renderProjects();
    } else {
      authSection.style.display = 'flex';
      adminSection.style.display = 'none';
    }
  }

  function handleLogin(event) {
    event.preventDefault();
    const password = document.getElementById('adminPassword').value;
    const errorEl = document.getElementById('authError');

    if (password === ADMIN_PASSWORD) {
      localStorage.setItem(AUTH_KEY, 'true');
      document.getElementById('authForm').reset();
      errorEl.classList.remove('active');
      checkAuth();
    } else {
      errorEl.textContent = '❌ Неверный пароль';
      errorEl.classList.add('active');
    }
  }

  function handleLogout() {
    if (confirm('Вы уверены, что хотите выйти?')) {
      localStorage.removeItem(AUTH_KEY);
      document.getElementById('authForm').reset();
      checkAuth();
    }
  }

  // ── Storage Functions ──
  function getProjects() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveProjects() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
  }

  function showStatus(message, type = 'success') {
    const statusEl = document.getElementById('statusMessage');
    statusEl.className = 'status-message';
    statusEl.classList.add(`status-${type}`);
    statusEl.textContent = message;
    statusEl.style.display = 'block';
    setTimeout(() => {
      statusEl.style.display = 'none';
    }, 3000);
  }

  // ── Form Functions ──
  function handleFormSubmit(event) {
    event.preventDefault();

    const formData = {
      id: currentEditId || Date.now().toString(),
      name: document.getElementById('projectName').value.trim(),
      desc: document.getElementById('projectDesc').value.trim(),
      fullDesc: document.getElementById('projectFullDesc').value.trim(),
      price: document.getElementById('projectPrice').value.trim(),
      time: document.getElementById('projectTime').value.trim(),
      status: document.getElementById('projectStatus').value,
      image: document.getElementById('projectImage').value.trim(),
      url: document.getElementById('projectUrl').value.trim(),
      tags: document.getElementById('projectTags').value.trim().split(',').map(t => t.trim()).filter(t => t)
    };

    if (currentEditId) {
      const index = projects.findIndex(p => p.id === currentEditId);
      if (index !== -1) {
        projects[index] = formData;
        showStatus('✓ Проект обновлён', 'success');
      }
    } else {
      projects.push(formData);
      showStatus('✓ Проект добавлен', 'success');
    }

    saveProjects();
    resetForm();
    renderProjects();
  }

  function resetForm() {
    document.getElementById('projectForm').reset();
    document.getElementById('formTitle').textContent = '➕ Добавить новый проект';
    document.getElementById('submitBtn').textContent = 'Добавить проект';
    currentEditId = null;
  }

  // ── Render Functions ──
  function renderProjects() {
    const container = document.getElementById('projectsList');
    const count = document.getElementById('projectCount');
    count.textContent = projects.length;

    if (projects.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-text">Проектов пока нет. Добавьте первый проект!</div>
        </div>
      `;
      return;
    }

    container.innerHTML = projects.map(project => `
      <div class="project-card">
        <div class="project-card-header">
          <h3>${escapeHtml(project.name)}</h3>
        </div>
        <div class="project-card-badges">
          <span class="project-badge">${project.status}</span>
          ${project.tags && project.tags.length > 0 ? 
            project.tags.slice(0, 2).map(tag => `<span class="project-badge">${escapeHtml(tag)}</span>`).join('') 
            : ''}
        </div>
        <div class="project-card-meta">
          ${project.price ? `<span>💰 ${escapeHtml(project.price)}</span>` : ''}
          ${project.time ? `<span>⏱ ${escapeHtml(project.time)}</span>` : ''}
        </div>
        <div class="project-card-desc">${escapeHtml(project.desc)}</div>
        <div class="project-card-actions">
          <button class="btn-edit" onclick="editProject('${project.id}')">Редактировать</button>
          <button class="btn-delete" onclick="deleteProject('${project.id}')">Удалить</button>
        </div>
      </div>
    `).join('');
  }

  function editProject(id) {
    const project = projects.find(p => p.id === id);
    if (!project) return;

    currentEditId = id;
    document.getElementById('projectName').value = project.name;
    document.getElementById('projectDesc').value = project.desc;
    document.getElementById('projectFullDesc').value = project.fullDesc || '';
    document.getElementById('projectPrice').value = project.price || '';
    document.getElementById('projectTime').value = project.time || '';
    document.getElementById('projectStatus').value = project.status || 'Завершён';
    document.getElementById('projectImage').value = project.image || '';
    document.getElementById('projectUrl').value = project.url || '';
    document.getElementById('projectTags').value = project.tags ? project.tags.join(', ') : '';

    document.getElementById('formTitle').textContent = '✏️ Редактировать проект';
    document.getElementById('submitBtn').textContent = 'Сохранить изменения';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function deleteProject(id) {
    const project = projects.find(p => p.id === id);
    if (!project) return;

    deleteTargetId = id;
    document.getElementById('deleteConfirmText').textContent = `Вы точно хотите удалить проект "${project.name}"? Это действие невозможно отменить.`;
    document.getElementById('deleteModal').classList.add('active');
  }

  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('active');
    deleteTargetId = null;
  }

  function confirmDelete() {
    if (deleteTargetId) {
      projects = projects.filter(p => p.id !== deleteTargetId);
      saveProjects();
      showStatus('✓ Проект удалён', 'success');
      renderProjects();
      closeDeleteModal();
    }
  }

  // ── Utility Functions ──
  function escapeHtml(text) {
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  // ── Close modal on ESC ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeDeleteModal();
    }
  });
</script>

</body>
</html>
